name: ROS2 CI - Check 

on:
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: BUILD->Build Docker image
        run: docker build -t ros2-test-image .

      - name: BUILD->Build workspace
        run: |
          docker run --rm -e PYTHONPATH=/home/ws/src ros2-test-image bash -lc "
            cd /home/ws &&
            colcon build --symlink-install
          "
      - name: TEST->Run tests
        run: |
          docker run --rm -e PYTHONPATH=/home/ws/src --network host -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/tmp ros2-test-image bash -lc "
            cd /home/ws &&
            colcon build &&
            source install/setup.bash &&
            
            colcon test --event-handlers console_direct+ &&

            colcon test-result --verbose && 

            colcon test \
            --event-handlers console_direct+ \
            --pytest-args \
              --cov \
              --cov-report=term-missing \
              --cov-report=xml:/tmp/coverage.xml \
              --junitxml=/tmp/pytest.xml \
            | tee /tmp/pytest-coverage.txt &&


            # Combine coverage files from all packages
            coverage combine \$(find src -name '.coverage') &&

            # Generate terminal coverage report (for PR comment)
            coverage report -m | tee /tmp/pytest-coverage.txt &&

            # Generate XML coverage (for badge / Codecov)
            coverage xml -o /tmp/coverage.xml --include 'src/*'
          "
      - name: CODE_COVERAGE->coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: /tmp/pytest.xml
          junitxml-path: /tmp/pytest.xml