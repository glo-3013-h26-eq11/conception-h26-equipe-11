name: ROS2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ros2-test-image
      REGISTRY: ghcr.io
      REPO: ${{ github.repository }}
      TAG: latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: BUILD->Build Docker image
        run: docker build -t ros2-test-image .

      - name: BUILD->Build workspace
        run: |
          docker run --rm -e PYTHONPATH=/home/ws/src ros2-test-image bash -lc "
            cd /home/ws &&
            colcon build --symlink-install
          "
      - name: TEST->Run tests
        run: |
          docker run --rm -e PYTHONPATH=/home/ws/src ros2-test-image bash -lc "
            cd /home/ws &&
            colcon build &&
            source install/setup.bash &&
            colcon test --event-handlers console_direct+
          "

      - name: DEPLOY->Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: DEPLOY->Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: DEPLOY->Build and push multi-arch Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            USERNAME=devuser
            USER_UID=1000
            USER_GID=1000
